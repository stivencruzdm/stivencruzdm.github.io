<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>[hidden]{display:none!important}body{margin:0}</style><title>Stiven Cruz Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#060b1d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Concepto: web oscura azul marino con panal de hexágonos como motivo (cada disciplina es una celda), rojo y cian como únicos acentos. */
:root{
  --bg:#060b1d; --bg2:#0a1330; --panel:#0d1838; --panel2:#132250; --line:#22346b;
  --fg:#eaf0ff; --mut:#8fa0cc; --red:#ff3d54; --cyan:#27d7f2;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'DM Sans','Segoe UI',system-ui,sans-serif;
  --hw:128px; --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--fg); font-family:var(--body); font-size:16px; line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0; overflow-x:hidden; margin:0;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(60vw 50vh at 8% -5%,color-mix(in srgb,var(--red) 20%,transparent),transparent 70%),
   radial-gradient(55vw 50vh at 100% 25%,color-mix(in srgb,var(--cyan) 14%,transparent),transparent 70%),
   radial-gradient(50vw 40vh at 30% 110%,color-mix(in srgb,var(--cyan) 10%,transparent),transparent 70%)}
.wrap{max-width:1180px;margin-inline:auto;position:relative;z-index:1}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.05;letter-spacing:-.02em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}
.hex{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}

/* barra */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.bar-in{max-width:1180px;margin:auto;display:flex;align-items:center;gap:18px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.logo svg{width:34px;height:34px;flex:none}
.logo-img{height:36px;width:31px;flex:none;object-fit:cover;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.logo-img.fit{object-fit:contain;padding:8px 4px;box-sizing:border-box;background:linear-gradient(135deg,var(--red),var(--cyan))}
.logo-img.free{width:auto;max-width:160px;height:38px;clip-path:none;object-fit:contain;padding:0;background:none!important}
.dr-x:disabled{opacity:.35;cursor:default}
.logo b{display:block;font-family:var(--display);font-size:1.02rem;line-height:1.05;letter-spacing:-.01em}
.logo small{display:block;font-size:.68rem;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;gap:4px;margin-left:auto;overflow:auto;scrollbar-width:none}
.nav a{padding:8px 10px;border-radius:99px;text-decoration:none;font-size:.88rem;color:var(--mut);white-space:nowrap;transition:.25s}
.nav a.on{color:var(--fg);background:color-mix(in srgb,var(--panel2) 80%,transparent)}
.search{position:relative;flex:0 1 220px;min-width:0}
.search input{width:100%;height:38px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:0 14px 0 36px;font:inherit;font-size:.9rem}
.search input::placeholder{color:var(--mut)}
.search svg{position:absolute;left:12px;top:50%;translate:0 -50%;width:16px;height:16px;color:var(--mut)}
.edit-btn{flex:none;height:38px;padding:0 16px;border-radius:99px;border:1px solid color-mix(in srgb,var(--red) 60%,transparent);background:color-mix(in srgb,var(--red) 14%,transparent);font-weight:700;font-size:.85rem}

@media(max-width:1080px){.nav{display:none}.search{margin-left:auto}}
@media(max-width:520px){.logo small{display:none}.search{flex-basis:120px}.edit-btn{padding:0 12px}}

/* secciones */
.sec{padding-block:clamp(60px,9vw,112px);scroll-margin-top:64px}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);font-weight:700;margin-bottom:14px}
.eyebrow i{width:14px;height:16px;background:var(--red);display:block}
.sec h2{font-size:clamp(2.2rem,5.5vw,4rem);font-weight:700;margin-bottom:clamp(28px,4vw,48px)}
.rv{opacity:0;transform:translateY(20px);transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:calc(var(--d,0)*70ms)}
.rv.in{opacity:1;transform:none}
html.noanim .rv{opacity:1;transform:none;transition:none}

/* portada */
.hero{padding-block:clamp(36px,6vw,80px) 0;position:relative}
.hero-in{display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center}
@media(max-width:900px){.hero-in{grid-template-columns:1fr}}
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);font-weight:700;margin:0 0 22px}
.kicker i{width:34px;height:2px;background:var(--red)}
.hero h1{font-size:clamp(3.4rem,10.5vw,8.4rem);font-weight:800;line-height:.92;letter-spacing:-.04em}
.wm{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-right:.2em}
.w{display:inline-block;transform:translateY(105%);animation:up .95s var(--ease) forwards;animation-delay:calc(var(--i)*110ms + 120ms)}
.hero h1 .wm:nth-child(even) .w{background:linear-gradient(100deg,var(--red),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes up{to{transform:none}}
.role{margin:26px 0 0;font-size:clamp(1.15rem,2.4vw,1.6rem);display:flex;gap:.5em;flex-wrap:wrap;align-items:baseline}
.role span.pre{color:var(--mut)}
.rot{display:inline-block;font-family:var(--display);font-weight:700;color:var(--fg);border-bottom:3px solid var(--red);padding-bottom:1px;animation:swap .6s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.lead{max-width:56ch;color:var(--mut);margin:22px 0 0;font-size:1.05rem}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:99px;background:var(--red);color:#fff;text-decoration:none;font-weight:700;border:1px solid var(--red);transition:.3s var(--ease)}

.btn.ghost{background:transparent;border-color:var(--line);color:var(--fg)}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,150px));gap:clamp(14px,4vw,40px);align-items:start;margin:38px 0 0;padding:0}
.stats div{display:flex;flex-direction:column}
.stats dt{font-family:var(--display);font-size:clamp(2rem,4vw,2.9rem);font-weight:800;line-height:1;order:1}
.stats dd{margin:6px 0 0;color:var(--mut);font-size:.85rem;order:2;max-width:none;line-height:1.3;min-height:2.6em}

/* panal */
.honey{position:relative;margin:auto;width:calc(var(--hw)*2.0667 + var(--hw));height:calc(var(--hw)*2.887);max-width:100%}
.cell{position:absolute;width:var(--hw);height:calc(var(--hw)*1.1547);left:calc(var(--hw)*1.0333*var(--x));top:calc(var(--hw)*.866*var(--y));
  border:0;padding:0;background:linear-gradient(145deg,var(--red),var(--cyan));clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  animation:float 6s ease-in-out infinite;animation-delay:calc(var(--n)*-.9s);transition:filter .3s,scale .4s var(--ease)}
.cell::before{content:"";position:absolute;inset:3px;background:var(--panel);clip-path:inherit;transition:background .3s}

.cell.core::before{background:color-mix(in srgb,var(--red) 28%,var(--panel))}
.cell span{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:0 16%;text-align:center;font-family:var(--display);font-weight:700;font-size:calc(var(--hw)*.115);line-height:1.1}
.cell small{font-family:var(--body);font-weight:500;color:var(--mut);font-size:calc(var(--hw)*.092);margin-top:4px}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -9px}}
.hero-art{display:flex;justify-content:center;padding-block:10px}
@media(max-width:480px){:root{--hw:100px}}
@media(max-width:360px){:root{--hw:88px}}

.marquee{margin-top:clamp(44px,7vw,84px);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));overflow:hidden;border-block:1px solid var(--line);background:color-mix(in srgb,var(--bg2) 70%,transparent);padding-block:16px;position:relative;z-index:1}
.track{display:flex;gap:40px;width:max-content;animation:mq 38s linear infinite}
.track span{display:inline-flex;align-items:center;gap:40px;font-family:var(--display);font-weight:600;font-size:1.25rem;color:var(--mut);white-space:nowrap}
.track span::after{content:"";width:12px;height:14px;background:var(--red);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
@keyframes mq{to{transform:translateX(-50%)}}

/* perfil */
.about{display:grid;grid-template-columns:1.4fr 1fr;gap:clamp(28px,5vw,64px)}
@media(max-width:860px){.about{grid-template-columns:1fr}}
.about p.big{font-size:clamp(1.15rem,2.2vw,1.5rem);line-height:1.55;margin:0;font-family:var(--display);font-weight:500;letter-spacing:-.01em}
.box{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--bg2));border-radius:18px;padding:24px}
.box h4{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin-bottom:14px;font-family:var(--body);font-weight:700}
.box+.box{margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.chips li{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg2);font-size:.9rem;transition:.25s}


/* trabajos */
.filters{display:grid;gap:14px;margin-bottom:28px}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fl{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);font-weight:700;min-width:86px}
.chip{padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:transparent;font-size:.88rem;transition:.25s}

.chip.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:22px}
.card{position:relative;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:18px;overflow:hidden;padding:0;display:flex;flex-direction:column;
  transition:transform .45s var(--ease),border-color .3s,box-shadow .4s;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}

.thumb{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--bg2)}
.thumb>*{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.thumb .yt{background-size:cover;background-position:center}
.thumb iframe{pointer-events:none}
.thumb img,.thumb video{transition:transform .8s var(--ease)}

.cover{display:block;background:linear-gradient(135deg,var(--c1),var(--c2));overflow:hidden}
.cover::before{content:"";position:absolute;right:-12%;top:-18%;width:70%;aspect-ratio:1/1.1547;background:rgba(255,255,255,.1);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.cover::after{content:"";position:absolute;right:12%;top:30%;width:34%;aspect-ratio:1/1.1547;border:0;background:rgba(0,0,0,.2);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.cover b{position:relative;z-index:1;font-family:var(--display);font-size:1.5rem;line-height:1;letter-spacing:-.02em;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.badge{position:absolute!important;inset:10px auto auto 10px!important;width:auto!important;height:auto!important;z-index:2;padding:4px 10px;border-radius:99px;background:rgba(6,11,29,.78);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;backdrop-filter:blur(6px)}
.badge.r{inset:10px 10px auto auto!important;background:var(--red)}
.cinfo{padding:16px 18px 18px;display:flex;flex-direction:column;gap:4px}
.cinfo h3{font-size:1.2rem;letter-spacing:-.01em;line-height:1.15}
.cinfo p{margin:0;color:var(--mut);font-size:.85rem}
.empty{padding:48px 20px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--mut)}

.dr .ghd input{flex:1}.gcount{color:var(--mut)}
.secs{display:grid;gap:22px}
/* secciones con 5 trabajos o más: filas de 3 y la última fila centrada (CENTER_MIN en el código) */
.grid.mid{display:flex;flex-wrap:wrap;justify-content:center}
.grid.mid>.card{flex:0 0 calc((100% - 44px)/3);min-width:0}
@media(max-width:1035px){.grid.mid>.card{flex-basis:calc((100% - 22px)/2)}}
@media(max-width:693px){.grid.mid>.card{flex-basis:100%}}
.lg{position:fixed;inset:0;z-index:180;display:grid;place-items:center;padding:16px;background:rgba(3,6,18,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lg[hidden]{display:none}
.lgc{width:min(100%,360px);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;display:grid;gap:14px}
.lgc h2{font-size:1.3rem}.lgh{margin:0;color:var(--mut);font-size:.9rem}
.lgc label{display:grid;gap:6px;font-size:.85rem;color:var(--mut)}
.lgc input{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--fg);font:inherit;font-size:16px}
.lgc input:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
.lg-err{margin:0;color:#ff8a98;font-size:.85rem}
.lgb{display:flex;gap:10px}
.lgc button{flex:1;padding:12px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--fg);font-weight:700}
.lgc label.lgs{display:flex;align-items:center;gap:8px;font-size:.85rem}.lgc label.lgs input{width:auto;padding:0}
.lgc button.go{background:var(--red);border-color:var(--red);color:#fff}
.lgc button:disabled{opacity:.5}
.edu .seal,.job .seal{position:relative}a.seal{text-decoration:none;transition:transform .25s var(--ease)}a.seal:active{transform:scale(.96)}@media (hover:hover) and (pointer:fine){a.seal:hover{transform:scale(1.05)}}
.seal-img.fill{left:0;top:0;translate:none;width:100%;height:100%;object-fit:cover}
.seal-img{position:absolute;left:50%;top:50%;translate:-50% -50%;width:66%;height:57%;object-fit:contain;display:block}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,max(260px,calc((100% - 36px)/3))),1fr));gap:18px;align-items:start}
.cert{padding:16px;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--panel) 85%,transparent);display:flex;flex-direction:column}
.ct{margin:0 0 12px;font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;color:var(--cyan);overflow-wrap:anywhere}
.cimg{display:block;width:100%;padding:0;border:0;border-radius:10px;overflow:hidden;background:#060b1d;color:inherit}
.cimg img{display:block;width:100%;height:auto;max-height:480px;object-fit:contain}
.cdocile{display:grid;place-items:center;gap:8px;min-height:170px;color:var(--cyan);font-weight:700}
.cdesc{margin:12px 0 0;color:var(--mut);font-size:.92rem;line-height:1.5;white-space:pre-line;overflow-wrap:anywhere}
.cdoc{margin-top:12px;align-self:flex-start;padding:9px 16px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--cyan);font-weight:700}
@media (hover:hover) and (pointer:fine){.cimg:hover img,.cdocile:hover{opacity:.9}.cdoc:hover{border-color:var(--cyan)}}
.chips li.cf{display:inline-flex;align-items:center;gap:8px}.flag{width:20px;height:14px;border-radius:2px;object-fit:cover;flex:none;display:block}
.camp li{padding:10px 18px;font-weight:600}
.skills .ai{grid-column:1/-1}.aig{display:flex;flex-wrap:wrap;gap:10px;margin:0;padding:0;list-style:none}
.aig li{display:flex;align-items:center;gap:10px;padding:8px 18px 8px 8px;border:1px solid var(--line);border-radius:99px;background:var(--bg2);font-weight:600}
.aiic{position:relative;width:32px;height:32px;border-radius:10px;background:#fff;overflow:hidden;flex:none}
.aiic::before{content:attr(data-i);position:absolute;inset:0;display:grid;place-items:center;color:#0a0f24;font-weight:800}
.aiic img{position:absolute;inset:5px;width:22px;height:22px;object-fit:contain;background:#fff;display:block}
.socials{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0 0;padding:0;list-style:none}
.soc{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);transition:transform .25s var(--ease),border-color .25s,color .25s}
.soc:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){.soc:hover{border-color:var(--cyan);color:var(--cyan);transform:translateY(-3px)}}
.mbtn{display:none;flex:none;width:42px;height:42px;padding:0;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);place-items:center}
.mbtn svg{width:22px;height:22px}
.mmenu{position:absolute;left:0;top:100%;width:min(88vw,340px);max-height:calc(100dvh - 84px);overflow:auto;margin:6px 12px;padding:10px;display:grid;gap:2px;border:1px solid var(--line);border-radius:18px;background:var(--bg2);box-shadow:0 20px 50px rgba(0,0,0,.55);z-index:60}
.mmenu[hidden]{display:none}
.mmenu a{display:block;padding:12px 14px;border-radius:12px;text-decoration:none;color:var(--fg);font-weight:700}
.mmenu a.sub{margin-left:18px;padding:9px 14px;font-weight:500;color:var(--mut);border-left:2px solid var(--line);border-radius:0 12px 12px 0}
.mmenu a.on{background:color-mix(in srgb,var(--panel2) 80%,transparent)}
@media(max-width:1080px){.mbtn{display:grid}}
@media (hover:hover) and (pointer:fine){.mmenu a:hover{background:color-mix(in srgb,var(--panel2) 80%,transparent);color:var(--cyan)}}
.subh{margin:16px 0 6px;font-weight:700;color:var(--fg)}
.lb-stage.vid{display:block;aspect-ratio:auto;max-height:none;overflow:hidden;position:relative}
.lb-stage.vid>.vw{position:absolute;left:0;right:0;top:56px;bottom:112px;width:auto;height:auto;overflow:hidden;display:grid;place-items:center}
.lb-card.ovh .lb-stage.vid>.vw{bottom:0}
.vbox>*{display:block;width:100%;height:100%;border:0;object-fit:contain;background:#000}
.contact>.box,.skills>.box,.about .grid>.box{margin-top:0}
.mmenu .mg{display:grid}.mnrow{display:flex;align-items:center;gap:2px}.mnrow a{flex:1}
.mx{flex:none;width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:12px;background:transparent;color:var(--mut)}
.mx svg{width:20px;height:20px;transition:transform .25s var(--ease)}.mx[aria-expanded=true] svg{transform:rotate(180deg)}
.msub{display:grid;gap:2px;margin:2px 0 8px}.msub[hidden]{display:none}
@media (hover:hover) and (pointer:fine){.mx:hover{color:var(--cyan)}}
.gs{width:100%;margin-top:8px}
.lb-gh{flex:none;align-self:center;padding:6px 12px;border-radius:99px;border:1px solid var(--line);color:var(--cyan);font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.acc-h{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:44px;padding:0;border:0;background:transparent;color:var(--fg);text-align:left;font:inherit}
.acc-h b{display:block;overflow-wrap:anywhere}.acc-h small{display:block;color:var(--mut);font-weight:400;font-size:.8rem;overflow-wrap:anywhere}
.acc-h .chv{flex:none;width:30px;height:30px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line);color:var(--cyan)}
.sec2{border-bottom:1px solid var(--line)}
.sec2-h{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:0;border:0;background:transparent;color:inherit;text-align:left;font:inherit}
.sec2-h h4{margin:0;flex:1}
.sec2-h .chv{flex:none;width:30px;height:30px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line);color:var(--cyan)}

const IDB={db:null,open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);try{const r=indexedDB.open('stiven-cruz-portfolio',1);r.onupgradeneeded=()=>r.result.createObjectStore('v',{keyPath:'id'});r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},

  all(){return this.run('readonly',s=>s.getAll())},put(o){return this.run('readwrite',s=>s.put(o))},del(id){return this.run('readwrite',s=>s.delete(id))}};

/* Acceso al editor: usuario y contraseña (se guardan como hash, nunca en texto). Es una barrera de interfaz: lo que ven los demás solo cambia si subís un nuevo portfolio.json a tu hosting. */
const AUTH0={s:'4e30ccb7ab51b145',h:'449227fe0a298aae4aa7be430627b1444253c8047ce5a0cc05fd95bffc603fb8'};
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const authHash=(s,u,p)=>sha(s+'|'+u.trim().toLowerCase()+'|'+p);
let lgFails=0;
function openLogin(){const lg=$('#lg');lg.hidden=false;$('#lgSh').checked=false;$('#lgP').type='password';$('#lgE').hidden=true;$('#lgP').value='';setTimeout(()=>$('#lgU').focus(),30)}

async function doLogin(){const go=$('#lgGo'),er=$('#lgE');if(go.disabled)return;go.disabled=true;
  try{if(!(window.crypto&&crypto.subtle))throw 0;const a=S.auth&&S.auth.h?S.auth:AUTH0;const pv=$('#lgP').value;const ok=(await authHash(a.s,$('#lgU').value,pv))===a.h||(await authHash(a.s,$('#lgU').value,pv.trim()))===a.h;

/* ---------- medios ---------- */
function parseMedia(m){if(m.on===false)return null;const r=parseMedia0(m);if(r)r.m=m;return r}
function parseMedia0(m){
  const u=(m.url||'').trim(); if(!u)return null; let x;
  if(x=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/))return{k:'yt',id:x[1],short:/youtube\.com\/shorts\//.test(u)};
  if(x=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=|thumbnail\?id=)([\w-]{10,})/))return{k:m.type==='video'?'drive-v':'drive-i',id:x[1]};
  if(m.type==='video'||/\.(mp4|webm|mov|m4v)(\?|$)/i.test(u))return{k:'file-v',u};
  return{k:'img',u};
}
const poster=m=>m.k==='yt'?`https://img.youtube.com/vi/${m.id}/hqdefault.jpg`:m.k.startsWith('drive')?`https://drive.google.com/thumbnail?id=${m.id}&sz=w1600`:m.k==='img'?m.u:'';
const isVid=m=>['yt','drive-v','file-v'].includes(m.k);

function coverSrc(w){const u=(w.cover||'').trim();if(!u)return '';if(u.startsWith('data:'))return u;const c=parseMedia0({url:u,type:'image'});return c?poster(c):''}
const ytSrc=(id,snd,ctl)=>`https://www.youtube.com/embed/${id}?autoplay=1&mute=${snd?0:1}&loop=1&playlist=${id}&controls=${ctl?1:0}&rel=0&playsinline=1&modestbranding=1`;
function hue(str){let h=0;for(const c of str)h=(h*31+c.charCodeAt(0))>>>0;return h%4}

function coverHTML(w){const [a,b]=COVERS[hue(w.cat+w.title)];return `<div class="cover" style="--c1:${a};--c2:${b}"></div>`}
function mediaOf(w){const ord=['',...(w.groups||[]).map(g=>g.id)],ix=g=>{const k=ord.indexOf(g||'');return k<0?0:k};return w.media.map((m,j)=>[m,j]).sort((a,b)=>ix(a[0].g)-ix(b[0].g)||a[1]-b[1]).map(x=>x[0])}
const groupName=(w,id)=>((w.groups||[]).find(g=>g.id===id)||{}).name||'';
function thumbHTML(w){
  const m=mediaOf(w).map(parseMedia).filter(Boolean)[0]; let inner=coverHTML(w); let badge='';const cs=coverSrc(w);if(cs)inner+=`<img loading="lazy" alt="${esc(w.title)}" src="${esc(cs)}">`;
  if(m){ if(cs){} else if(m.k==='yt')inner+=`<div class="yt" data-yt="${m.id}" style="background-image:url(${poster(m)})"></div>`;
    else if(m.k==='file-v')inner+=`<video data-auto muted loop playsinline preload="metadata" src="${esc(m.u)}"></video>`;
    else inner+=`<img loading="lazy" alt="${esc(w.title)}" src="${esc(poster(m))}">`;
    if(isVid(m))badge='<span class="badge r">Video</span>'; }
  if(w.sample)badge+='<span class="badge">Ejemplo</span>';
  return `<div class="thumb">${inner}${badge}</div>`;
}
function mediaFull(m,w,snd){

$('#upCert').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f||certI==null||!S.certs[certI])return;if(!f.type.startsWith('image/')){toast('Subí una imagen (JPG o PNG). Para un PDF usá “Subir PDF”');return}try{S.certs[certI].img=await certData(f);save();drawDr();renderAll();toast('Imagen actualizada')}catch(err){toast('No pude usar esa imagen')}});
let sealRef=null;const sealObj=b=>b.dataset.t==='x'?S.experience[+b.dataset.i]:b.dataset.t==='b'?S.brand:S.education;
function analyzeSeal(src){return new Promise(ok=>{const im=new Image();im.onerror=()=>ok({mode:'fill',bg:''});im.onload=()=>{try{const N=32,c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,N,N);const D=x.getImageData(0,0,N,N).data;
  let opq=0;const cnt={};for(let k=0;k<D.length;k+=4){if(D[k+3]<250)continue;opq++;const q=(D[k]>>4)+','+(D[k+1]>>4)+','+(D[k+2]>>4),o=cnt[q]||(cnt[q]={n:0,r:0,g:0,b:0});o.n++;o.r+=D[k];o.g+=D[k+1];o.b+=D[k+2]}
  const ratio=opq/(N*N),C=[[0,0],[N-1,0],[0,N-1],[N-1,N-1]].map(([a,b])=>{const k=(b*N+a)*4;return[D[k],D[k+1],D[k+2],D[k+3]]}),clear=C.filter(d=>d[3]<40).length;
  const hex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
  if(ratio<.9)return ok(clear>=3&&ratio>=.55?{mode:'fill',bg:''}:{mode:'fit',bg:''});
  if([0,1,2].every(i=>Math.max(...C.map(d=>d[i]))-Math.min(...C.map(d=>d[i]))<=24))return ok({mode:'fit',bg:hex(...[0,1,2].map(i=>C.reduce((a,d)=>a+d[i],0)/4))});
  let best=null;for(const q in cnt)if(!best||cnt[q].n>best.n)best=cnt[q];
  ok(best&&best.n/opq>=.5?{mode:'fit',bg:hex(best.r/best.n,best.g/best.n,best.b/best.n)}:{mode:'fill',bg:''})}catch(err){ok({mode:'fill',bg:''})}};im.src=src})}
/* las imágenes de hexágonos guardadas se revisan al cargar: así todas llenan la figura (salvo las que se ajustaron a mano) */
function reanalyze(){Promise.all([[S.education,'img'],...(S.experience||[]).map(j=>[j,'img']),[S.brand,'logo']].map(async([o,k])=>{if(!o||o.imgCustom||!(o[k]||'').startsWith('data:'))return false;const an=await analyzeSeal(o[k]),ch=o.imgMode!==an.mode||(o.imgBg||'')!==an.bg;o.imgMode=an.mode;o.imgBg=an.bg;return ch})).then(r=>{if(r.some(Boolean))renderAll()})}
$('#upDoc').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f||certI==null||!S.certs[certI])return;if(f.type!=='application/pdf'){toast('Tiene que ser un PDF');return}if(f.size>1200000){toast('El PDF pesa más de 1,2 MB: subilo a Drive y pegá el link');return}const r=new FileReader();r.onload=()=>{S.certs[certI].doc=r.result;save();drawDr();renderAll();toast('Documento cargado')};r.onerror=()=>toast('No pude leer el PDF');r.readAsDataURL(f)});
function sealData(f){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{if(f.type==='image/svg+xml'){f.size>400000?no():ok(r.result);return}const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,560/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(/png|webp|gif/.test(f.type)?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.88))};im.src=r.result};r.readAsDataURL(f)})}
$('#upSeal').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(!f.type.startsWith('image/')){toast('Tiene que ser una imagen');return}try{const o=sealRef||S.education;o.img=await sealData(f);{const an=await analyzeSeal(o.img);o.imgBg=an.bg;o.imgMode=an.mode;o.imgCustom=false}save();drawDr();renderAll();toast('Imagen actualizada')}catch(err){toast('No pude usar esa imagen')}});
function coverData(file){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const R=1.6;let cw=im.width,ch=im.height;if(cw/ch>R)cw=ch*R;else ch=cw/R;const ow=Math.min(1280,Math.round(cw)),oh=Math.round(ow/R),c=document.createElement('canvas');c.width=ow;c.height=oh;c.getContext('2d').drawImage(im,(im.width-cw)/2,(im.height-ch)/2,cw,ch,0,0,ow,oh);ok(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(file)})}
$('#upCover').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f||editW==null||!S.works[editW])return;if(!f.type.startsWith('image/')){toast('La carátula tiene que ser una imagen');return}try{S.works[editW].cover=await coverData(f);S.works[editW].sample=false;save();drawDr();renderAll();toast('Carátula actualizada')}catch(err){toast('No pude leer esa imagen')}});
dr.addEventListener('dragover',e=>{const d=e.target.closest('[data-drop]');if(d){e.preventDefault();d.classList.add('over')}});
dr.addEventListener('dragleave',e=>{const d=e.target.closest('[data-drop]');if(d)d.classList.remove('over')});
dr.addEventListener('drop',e=>{const d=e.target.closest('[data-drop]');if(!d)return;e.preventDefault();d.classList.remove('over');addFiles(e.dataTransfer.files,+d.dataset.drop)});
function shrink(file){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,1280/im.width);const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(file)})}

$('#upLogo').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{S.brand.logo=await logoData(f);{const an=await analyzeSeal(S.brand.logo);S.brand.imgMode=an.mode;S.brand.imgBg=an.bg;S.brand.imgCustom=false}save();drawDr();renderAll()}catch(err){toast('No pude usar ese archivo como logo')}});
function logoData(f){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{if(f.type==='image/svg+xml'){f.size>400000?no():ok(r.result);return}const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,160/im.height);const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/png'))};im.src=r.result};r.readAsDataURL(f)})}
{const pg=document.querySelector('.prog');let tk=0;addEventListener('scroll',()=>{if(tk)return;tk=requestAnimationFrame(()=>{tk=0;const h=document.documentElement.scrollHeight-innerHeight;pg.style.setProperty('--p',h>0?Math.min(1,scrollY/h):0)})},{passive:true})}
/* Publicación: los cambios del editor viven solo en el navegador de quien edita. Si no hay copia local, se lee portfolio.json (subido junto a este archivo) para que todos los visitantes vean tus trabajos. */
try{if(!localStorage.getItem(KEY)){fetch('portfolio.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(o=>{if(o&&o.hero&&o.works){S=Object.assign(clone(DEFAULTS),migrate(o));renderAll();reanalyze()}}).catch(()=>{})}}catch(e){}
renderAll();reanalyze();
function hashGate(){if(location.hash==='#editar'){history.replaceState(null,'',location.pathname+location.search);toggleDr(true)}}
addEventListener('hashchange',hashGate);hashGate();
})();
